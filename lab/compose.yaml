name: trace-checkpoint
services:
  backend:
    image: python:3.12-slim
    command: ["python", "/app/backend.py"]
    volumes:
      - ./backend.py:/app/backend.py:ro
    ports:
      - "127.0.0.1:18080:8000"
    networks: [trace, access]
  waf:
    image: owasp/modsecurity-crs:apache
    environment:
      BACKEND: http://backend:8000
      SERVER_NAME: localhost
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "100"
      MODSEC_AUDIT_ENGINE: "On"
      MODSEC_AUDIT_LOG: /dev/stdout
    volumes:
      - ./active-rules.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
    ports:
      - "127.0.0.1:18081:8080"
    depends_on: [backend]
    networks: [trace, access]
networks:
  trace:
    internal: true
  access:
    driver: bridge
