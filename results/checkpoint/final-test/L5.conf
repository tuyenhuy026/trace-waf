# TRACE policy L5
Header always set X-Trace-Policy "L5"
SecRule REQUEST_URI "@rx ^/docs(?:[?]|$)" "id:110000,phase:1,pass,nolog,t:none,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:q,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:q,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:q,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:q,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:q"
SecRule REQUEST_URI "@rx ^/search(?:[?]|$)" "id:110001,phase:1,pass,nolog,t:none,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:q,ctl:ruleRemoveTargetByTag=attack-xss;ARGS:q,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:q,ctl:ruleRemoveTargetByTag=attack-rfi;ARGS:q,ctl:ruleRemoveTargetByTag=attack-rce;ARGS:q"
SecRule REQUEST_URI "@rx ^/sql(?:[?]|$)" "id:110002,phase:2,deny,status:403,log,t:none,chain"
    SecRule ARGS:q "@rx (?is)(?:'|%27)\s*(?:or|and)\s+\d+\s*=\s*\d+|\bunion\s+(?:all\s+)?select\b" "t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase"
SecRule REQUEST_URI "@rx ^/xss(?:[?]|$)" "id:110003,phase:2,deny,status:403,log,t:none,chain"
    SecRule ARGS:q "@rx <\s*script\b[^>]*>\s*window\s*\.\s*__trace\s*=\s*1\s*</\s*script\s*>|\bon(?:error|load)\s*=\s*[\x22']?\s*window\s*\.\s*__trace\s*=\s*1" "t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase"
SecRule REQUEST_URI "@rx ^/file(?:[?]|$)" "id:110004,phase:2,deny,status:403,log,t:none,chain"
    SecRule ARGS:q "@rx (?:^|/)\.\.(?:/|$)" "t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase"
